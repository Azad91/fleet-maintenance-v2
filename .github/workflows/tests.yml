name: Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fleet_maintenance_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: fleet_maintenance_test
      DB_USERNAME: postgres
      DB_PASSWORD: password
      APP_ENV: testing
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, mbstring, xml, zip, gd, bcmath
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Key
        run: php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Execute Tests
        run: php artisan test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=table

      - name: Check code formatting
        run: vendor/bin/pint --test

      - name: Audit Composer dependencies
        run: composer audit --locked

  production-image:
    name: Production Docker image
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          cp .env.production.db.example .env.production.db
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production image without development dependencies
        run: docker build --tag fleet-v2-app:ci .

      - name: Boot production image
        run: >-
          docker run --rm
          --env APP_ENV=production
          --env APP_DEBUG=false
          --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          --entrypoint php
          fleet-v2-app:ci
          artisan about --only=environment --no-ansi
