name: fleet-prod

services:
  # Apply outstanding schema changes and ensure the platform Super Admin
  # exists before any long-running application process starts. Both commands
  # are idempotent: migrations only apply pending files and UserSeeder never
  # overwrites an existing administrator's password.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FLEET_IMAGE:-fleet-v2-app:latest}
    container_name: fleet-prod-migrate
    restart: "no"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleet
    command:
      - /bin/sh
      - -c
      - >-
        php /var/www/html/artisan migrate --force --no-interaction
        && php /var/www/html/artisan db:seed --class=Database\Seeders\UserSeeder --force --no-interaction

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FLEET_IMAGE:-fleet-v2-app:latest}
    container_name: fleet-prod-app
    restart: unless-stopped
    # Production env faylı — sirləri bu fayldan oxuyur
    env_file:
      - .env.production
    # Yalnız reverse proxy (nginx/traefik/caddy) bu porta qoşula bilər.
    # Host-da birbaşa açmırıq — 127.0.0.1 ilə məhdudlaşdırırıq.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./storage:/var/www/html/storage
      # Removed public/storage mount to avoid symlink clash
      # Read-only view of the backup directory so /health can read the
      # freshness marker written by the backup sidecar. Mounted at a
      # fixed path that config/health.php points to.
      - ./backups:/var/www/html/storage/app/backups:ro
    container_name: fleet-prod-app
    restart: unless-stopped

    # Production env faylı — sirləri bu fayldan oxuyur
    env_file:
      - .env.production

    # Yalnız reverse proxy (nginx/traefik/caddy) bu porta qoşula bilər.
    # Host-da birbaşa açmırıq — 127.0.0.1 ilə məhdudlaşdırırıq.
    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./storage:/var/www/html/storage
      - ./public/storage:/var/www/html/public/storage
      # Read-only view of the backup directory so /health can read the
      # freshness marker written by the backup sidecar. Mounted at a
      # fixed path that config/health.php points to.
      - ./backups:/var/www/html/storage/app/backups:ro

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    networks:
      - fleet

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The production environment uses Laravel's database queue. Without a
  # worker, jobs remain in the `jobs` table indefinitely (for example, queued
  # notifications introduced later). Restart periodically so deployments pick
  # up the current code without requiring a separate process supervisor.
  queue:
    image: ${FLEET_IMAGE:-fleet-v2-app:latest}
    container_name: fleet-prod-queue
    restart: unless-stopped
    user: "33:33"
    env_file:
      - .env.production
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fleet
    command: ["php", "/var/www/html/artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=60", "--max-time=3600"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────
  # Laravel scheduler — runs every minute and dispatches due tasks
  # (see routes/console.php). `php artisan schedule:work` is Laravel's
  # own long-running loop, so no system cron is needed inside the
  # container.
  #
  # Uses the same image as the app service so the exact PHP version
  # and extensions are guaranteed to match. Shares the storage volume
  # so scheduled jobs (audit archive, PDF cleanup) write to the same
  # files the app reads.
  # ────────────────────────────────────────────────────────────────
  scheduler:
    image: ${FLEET_IMAGE:-fleet-v2-app:latest}
    container_name: fleet-prod-scheduler
    restart: unless-stopped
    # Run as www-data (uid 33) — the same user Apache uses inside the app
    # container. Without this the scheduler runs as root and creates log
    # files that Apache (www-data) cannot write to, causing 500 errors.
    # The host ./storage directory must also be chowned to 33:33:
    #   sudo chown -R 33:33 ./storage
    user: "33:33"
    env_file:
      - .env.production
    volumes:
      - ./storage:/var/www/html/storage
      - ./backups:/var/www/html/storage/app/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - fleet
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────
  # Backup sidecar — daily PostgreSQL dump + retention sweep.
  #
  # Runs on the same postgres:17-alpine image as the database so the
  # bundled pg_dump binary always matches the server major version.
  # Version skew between pg_dump and the server (e.g. pg_dump 16
  # against a 17 server) silently drops features and, on the reverse
  # direction, is flatly refused by the server.
  #
  # The /backups directory is a HOST BIND MOUNT (./backups), not a
  # named volume, so the operator can copy backups off-site with
  # rsync/scp without touching Docker at all.
  # ────────────────────────────────────────────────────────────────
  backup:
    image: postgres:17-alpine
    container_name: fleet-prod-backup
    restart: unless-stopped
    env_file:
      - .env.production.db
    volumes:
      - ./backups:/backups
      - ./docker/backup/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./docker/backup/backup-run.sh:/usr/local/bin/backup-run.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleet
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────
  # PostgreSQL 17 — production database
  # ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: fleet-prod-postgres
    restart: unless-stopped

    env_file:
      - .env.production.db

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    networks:
      - fleet

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_prod_data:
    name: fleet_prod_postgres_data

networks:
  fleet:
    name: fleet_prod_network
    driver: bridge
