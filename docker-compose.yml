name: fleet-v2

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-v2-app
    ports:
      - "8000:80"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./storage:/var/www/html/storage
      - ./public/storage:/var/www/html/public/storage
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./lang:/var/www/html/lang
      - ./public:/var/www/html/public
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./tests:/var/www/html/tests
      - ./pint.json:/var/www/html/pint.json
      - ./phpunit.xml:/var/www/html/phpunit.xml
    networks:
      - fleet-v2

  postgres:
    image: postgres:17
    container_name: fleet-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet_maintenance_v2
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_password
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_maintenance_v2"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fleet-v2

volumes:
  postgres_v2_data:
    name: fleet_v2_postgres_data

networks:
  fleet-v2:
    name: fleet-v2-network
