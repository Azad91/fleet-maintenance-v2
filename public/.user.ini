; ────────────────────────────────────────────────────────────────
; PHP runtime overrides for the public web root.
;
; Read by PHP-FPM and the CGI/FastCGI SAPI only. It is NOT read by
; mod_php (the php:*-apache Docker image uses mod_php — see the
; Dockerfile for that case) or by the CLI server (`php artisan serve`).
;
; ────────────────────────────────────────────────────────────────

; Large complaint forms, bulk imports and long nested arrays used to
; hit PHP's default 1000-input cap and get silently truncated. Raised
; to 3000 so a complaint with ~150 parts, or a bulk-import payload,
; can be submitted without losing fields.
max_input_vars = 3000

; Match the OPcache directive from the Dockerfile so opcache does not
; re-validate timestamps on every request in production.
; (FPM-only; harmless in dev.)
; opcache.validate_timestamps = 0
